apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: heavenlake
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: heavenlake
            - name: POSTGRES_PASSWORD
              value: heavenlake
            - name: POSTGRES_DB
              value: heavenlake
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: heavenlake
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
