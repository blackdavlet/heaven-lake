apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: heavenlake
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: heavenlake-api:latest
          imagePullPolicy: Never
          command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
          envFrom:
            - configMapRef:
                name: heavenlake-config
            - secretRef:
                name: heavenlake-secrets
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: heavenlake
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
