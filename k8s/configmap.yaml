apiVersion: v1
kind: ConfigMap
metadata:
  name: heavenlake-config
  namespace: heavenlake
data:
  DATABASE_URL: "postgresql+asyncpg://heavenlake:heavenlake@postgres:5432/heavenlake"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_PUBLIC_ENDPOINT: "http://localhost:9000"
  MINIO_BUCKET: "heavenlake"
  REDIS_URL: "redis://:heavenlake@redis:6379/0"
  RABBITMQ_URL: "amqp://heavenlake:heavenlake@rabbitmq:5672/"
  MAX_CONCURRENT: "4"
