apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-u", "-m", "app.messaging.consumer"]
          envFrom:
            - configMapRef:
                name: heavenlake-config
            - secretRef:
                name: heavenlake-secrets
          env:
            - name: MAX_CONCURRENT
              value: {{ .Values.worker.maxConcurrent | quote }}
